<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My form page</title>
    <link rel="stylesheet" href="formcss/style.css">
</head>

<body>
    <form action="">
        <h2>Lets's work together, bro!</h2>
        <p><i><b>Have any project in mind??</b></i></p>

        <!-- create inputs -->
        <!-- full-name text input -->
        <label for="fullName">Full name</label>
        <br>
        <input class="fullname-input" type="text" id="fullName" autofocus placeholder="e.g. Matthew Okadinya">

        <br>
        <br>

        <!-- email input -->
        <label class="emailaddress-input" for="emailAddress">Email Address</label>
        <br>
        <input type="email" id="emailAddress" placeholder="e.g. example@example.com">

        <br>
        <br>

        <!-- description checkbox -->
        <label for="descCheckbox">What best describes you?</label>
        <br>
        <label for="">Business Owner: </label>
        <input type="checkbox" name="descCheckbox" id="descCheckbox">
        <label for="">Developer: </label>
        <input type="checkbox" name="descCheckbox" id="descCheckbox">
        <label for="">Recruiter: </label>
        <input type="checkbox" name="descCheckbox" id="descCheckbox">
        <label for="">Others: </label>
        <input type="checkbox" name="descCheckbox" id="descCheckbox">
    </form>
</body>

</html>
